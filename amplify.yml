version: 1
frontend:
  phases:
    preBuild:
      commands:
        - gem install bundler
        - bundle config set path 'vendor/bundle'
        - bundle install
    build:
      commands:
        - JEKYLL_ENV=production bundle exec jekyll build
  artifacts:
    baseDirectory: _site
    files:
      - '**/*'
  cache:
    paths:
      - vendor/bundle/**/*
